name: Executar Robô de Licitações SJC

on:
  schedule:
    # Roda a cada 2 horas na nuvem do GitHub
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite rodar manualmente no GitHub se quiser

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4 pandas playwright urllib3; fi
          playwright install --with-deps chromium

      - name: Executar Robô Scraper PNCP (Estadual)
        run: python robo_licitacoes_sjc_7.py

      - name: Executar Robô Licita.pub Regional (SJC, Jacareí, Caçapava)
        run: python robo_licita_pub_regional.py

      - name: Salvar e Enviar Dados Atualizados (licitacoes.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action Scraper"
          git config --global user.email "action@github.com"
          git add licitacoes.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nova no licitacoes.json."
          else
            git commit -m "bot: Atualização automática de licitações e links do PNCP [skip ci]"
            git fetch origin main
            git checkout origin/main -- descartados.json 2>/dev/null || true
            git merge -X ours origin/main --no-edit || true
            git push origin main
          fi
