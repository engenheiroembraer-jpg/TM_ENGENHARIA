=P8 * (1 - P12)

Ou se o P26 for a célula do seu STOP-LOSS direto:
Você pode simplesmente digitar o valor limite manualmente na célula P26 (ex: 7939,00 como já está verdinho ali na tela, ou 6500,00) para cada licitação.   
